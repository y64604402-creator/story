<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ものがたり広場</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2622;--sub:#8a7f74;--ac:#b5543a;--bd:#e6ded3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#26221f;--tx:#ece5dc;--sub:#9c9187;--ac:#e07a5f;--bd:#3a342f}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#26221f;--tx:#ece5dc;--sub:#9c9187;--ac:#e07a5f;--bd:#3a342f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;line-height:1.8}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
label.lb{font-size:14px;border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:#c0392b}
input,textarea{width:100%;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:4px 0 10px}
textarea{min-height:140px;line-height:1.8;resize:vertical}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.card h3{margin:0 0 4px;font-size:17px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ep{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.reader h2{font-size:20px;margin:8px 0 24px}
.reader p{margin:0 0 1.2em;white-space:pre-wrap;font-size:17px;line-height:2}
.reader img,.blk img{max-width:100%;display:block;margin:1.5em auto;border-radius:6px}
.blk{border:1px dashed var(--bd);border-radius:10px;padding:8px;margin-bottom:10px}
.blk .row{margin:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.dlg{background:var(--card);border-radius:14px;padding:20px;max-width:340px;width:100%}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header><h1 id="home">📖 ものがたり広場</h1><button class="p" id="newStory">＋ 物語</button></header>
<main id="app"></main>
<script>
const KEY='novel-site-v1';
let S=[];try{S=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存できませんでした（画像が多すぎるかも）')}};
function ask(msg,ok){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg"><p></p><div class="row" style="justify-content:flex-end"><button class="c">やめる</button><button class="p d2" style="background:#c0392b;border-color:#c0392b">削除する</button></div></div>';o.querySelector('p').textContent=msg;o.querySelector('.c').onclick=()=>o.remove();o.querySelector('.d2').onclick=()=>{o.remove();ok()};document.body.appendChild(o)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let v={page:'list'};
const app=document.getElementById('app');
const story=()=>S.find(s=>s.id===v.sid);
const ep=()=>story()&&story().eps.find(e=>e.id===v.eid);
const go=(o)=>{v=o;render();window.scrollTo(0,0)};

function render(){
  const st=story(),e=ep();
  if(v.page==='list'){
    app.innerHTML=S.length?S.map(s=>`<div class="card" data-a="open" data-s="${s.id}"><h3>${esc(s.title)}</h3><div class="sub">全${s.eps.length}話</div><div>${esc(s.desc||'')}</div></div>`).join(''):'<div class="empty">まだ物語がありません。<br>右上の「＋ 物語」から作ろう</div>';
  }else if(v.page==='story'){
    app.innerHTML=`<button data-a="home">← 一覧</button>
    <h2>${esc(st.title)}</h2><p class="sub">${esc(st.desc||'')}</p>
    <div class="row"><button class="p" data-a="newEp">＋ 話を追加</button><button data-a="editStory">物語を編集</button><button class="d" data-a="delStory">削除</button></div>
    ${st.eps.length?st.eps.map((x,i)=>`<div class="ep" data-a="read" data-e="${x.id}"><span>第${i+1}話　${esc(x.title)}</span><span class="sub">読む ›</span></div>`).join(''):'<div class="empty">まだ話がありません</div>'}`;
  }else if(v.page==='read'){
    const i=st.eps.indexOf(e),pv=st.eps[i-1],nx=st.eps[i+1];
    app.innerHTML=`<div class="row"><button data-a="open" data-s="${st.id}">← ${esc(st.title)}</button></div>
    <div class="reader"><div class="sub">第${i+1}話</div><h2>${esc(e.title)}</h2>
    ${e.blocks.map(b=>b.t==='img'?`<img src="${b.v}" alt="">`:`<p>${esc(b.v)}</p>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:30px">
    <button ${pv?`data-a="read" data-e="${pv.id}"`:'disabled'}>‹ 前の話</button>
    <button data-a="editEp" data-e="${e.id}">編集</button>
    <button ${nx?`data-a="read" data-e="${nx.id}"`:'disabled'}>次の話 ›</button></div>`;
  }else if(v.page==='storyForm'){
    const x=v.sid?st:{title:'',desc:''};
    app.innerHTML=`<h2>${v.sid?'物語を編集':'新しい物語'}</h2><label>タイトル</label><input id="t" value="${esc(x.title)}"><label>あらすじ</label><textarea id="d" style="min-height:90px">${esc(x.desc)}</textarea>
    <div class="row"><button class="p" data-a="saveStory">保存</button><button data-a="${v.sid?'open':'home'}" data-s="${v.sid||''}">キャンセル</button></div>`;
  }else if(v.page==='epForm'){
    const b=v.draft;
    app.innerHTML=`<h2>${v.eid?'話を編集':'新しい話'}</h2><label>話のタイトル</label><input id="t" value="${esc(v.title)}">
    ${b.map((x,i)=>`<div class="blk">${x.t==='img'?`<img src="${x.v}" alt="">`:`<textarea data-i="${i}" class="tx">${esc(x.v)}</textarea>`}
    <div class="row"><button data-a="up" data-i="${i}">↑</button><button data-a="dn" data-i="${i}">↓</button><button class="d" data-a="rm" data-i="${i}">削除</button></div></div>`).join('')}
    <div class="row"><button data-a="addTx">＋ 文章</button><label class="lb">🖼 画像<input type="file" id="img" accept="image/*" hidden></label></div>
    <div class="row"><button class="p" data-a="saveEp">保存</button>${v.eid?'<button class="d" data-a="delEp">この話を削除</button>':''}<button data-a="${v.eid?'read':'open'}" data-e="${v.eid||''}" data-s="${v.sid}">キャンセル</button></div>`;
  }
}
function sync(){ // keep text edits
  if(v.page!=='epForm')return;
  v.title=document.getElementById('t').value;
  document.querySelectorAll('.tx').forEach(t=>{v.draft[+t.dataset.i].v=t.value});
}
const keep=()=>{sync();const y=scrollY;render();scrollTo(0,y)};
document.getElementById('home').onclick=()=>go({page:'list'});
document.getElementById('newStory').onclick=()=>go({page:'storyForm'});
app.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  const a=el.dataset.a,d=el.dataset,i=+d.i;
  if(a==='home')go({page:'list'});
  else if(a==='open')go({page:'story',sid:d.s||v.sid});
  else if(a==='read')go({page:'read',sid:v.sid,eid:d.e});
  else if(a==='editStory')go({page:'storyForm',sid:v.sid});
  else if(a==='saveStory'){
    const t=document.getElementById('t').value.trim(),ds=document.getElementById('d').value;
    if(!t)return toast('タイトルを入れてね');
    if(v.sid){Object.assign(story(),{title:t,desc:ds});save();go({page:'story',sid:v.sid})}
    else{const n={id:uid(),title:t,desc:ds,eps:[]};S.unshift(n);save();go({page:'story',sid:n.id})}
  }
  else if(a==='delStory'){ask('この物語を削除する？（話もすべて消えます）',()=>{S=S.filter(s=>s.id!==v.sid);save();go({page:'list'})})}
  else if(a==='newEp')go({page:'epForm',sid:v.sid,title:'',draft:[{t:'text',v:''}]});
  else if(a==='editEp')go({page:'epForm',sid:v.sid,eid:v.eid,title:ep().title,draft:JSON.parse(JSON.stringify(ep().blocks))});
  else if(a==='addTx'){sync();v.draft.push({t:'text',v:''});keep()}
  else if(a==='rm'){sync();v.draft.splice(i,1);keep()}
  else if(a==='up'&&i>0){sync();[v.draft[i-1],v.draft[i]]=[v.draft[i],v.draft[i-1]];keep()}
  else if(a==='dn'&&i<v.draft.length-1){sync();[v.draft[i+1],v.draft[i]]=[v.draft[i],v.draft[i+1]];keep()}
  else if(a==='saveEp'){
    sync();const t=v.title.trim();if(!t)return toast('話のタイトルを入れてね');
    const blocks=v.draft.filter(b=>b.t==='img'||b.v.trim());
    if(v.eid){Object.assign(ep(),{title:t,blocks});save();go({page:'read',sid:v.sid,eid:v.eid})}
    else{const n={id:uid(),title:t,blocks};story().eps.push(n);save();go({page:'read',sid:v.sid,eid:n.id})}
  }
  else if(a==='delEp'){ask('この話を削除する？',()=>{const s=story();s.eps=s.eps.filter(x=>x.id!==v.eid);save();go({page:'story',sid:v.sid})})}
});
app.addEventListener('change',e=>{
  if(e.target.id!=='img')return;
  const f=e.target.files[0];if(!f)return;
  sync();
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const k=Math.min(1,900/im.width),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    v.draft.push({t:'img',v:c.toDataURL('image/jpeg',.8)},{t:'text',v:''});keep();
  };
  im.onerror=()=>toast('この画像は読み込めませんでした（JPEG/PNGで試してみて）');
  im.src=u;
});
render();
</script>
</body>
</html>
